# Builds the Windows installer, a portable zip, the macOS disk image and the Linux
# AppImage, and publishes them as a GitHub release.
#
# Normal way to release: bump the version (scripts/bump-version.sh) in a pull request
# and merge it. When a push to master changes Cargo.toml and the tag v<version> does
# not exist yet, this workflow builds, creates the tag and publishes the release, with
# release-notes/<version>.md at the top of the release text. Nobody pushes tags, so
# this works the same from local and cloud sessions.
#
# Fallbacks: a pushed tag (v1.2.3) also publishes. A manual run ("Run workflow") only
# builds and keeps the files as workflow artifacts for testing, unless "publish" is
# ticked: then a run on master publishes the release for the version in Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [master]
    paths: [Cargo.toml]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (and create its tag) for the version in Cargo.toml (master only)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PDFIUM_VERSION: "8165"

jobs:
  # Decides whether anything is built and whether it is published.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
      release: ${{ steps.c.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: c
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_type }}" = branch ]; then
            # A push to master that changed Cargo.toml: release only a new version
            # (not, say, a new dependency).
            if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
              echo "v$version already exists; nothing to release."
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "New version $version: building and publishing it."
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Determine version
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
            if ($version -ne $cargo) { throw "Tag v$version does not match Cargo.toml version $cargo" }
          } else {
            $version = $cargo
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Fetch PDFium
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:VERSION packaging\windows\magic-pdf.iss

      - name: Build portable zip
        shell: pwsh
        run: |
          $dir = "dist\magic-pdf-$env:VERSION-portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\magic-pdf.exe, third_party\pdfium\pdfium.dll $dir
          Copy-Item LICENSE "$dir\LICENSE.txt"
          Copy-Item third_party\pdfium\LICENSE "$dir\PDFIUM-LICENSE.txt"
          Copy-Item assets\fonts\phosphor\LICENSE "$dir\PHOSPHOR-LICENSE.txt"
          Copy-Item assets\fonts\noto-sans\OFL.txt "$dir\NOTO-SANS-LICENSE.txt"
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\magic-pdf-$env:VERSION-windows-portable.zip"

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic-pdf-windows
          path: |
            dist/*.exe
            dist/*.zip

  macos:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Determine version
        run: |
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "${{ github.ref_type }}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$cargo_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"; exit 1
          fi
          echo "VERSION=$cargo_version" >> "$GITHUB_ENV"

      - name: Fetch PDFium
        run: ./scripts/fetch-pdfium.sh

      - name: Test
        run: cargo test --release

      - name: Build app and disk image
        run: packaging/macos/build-app.sh

      - name: Smoke test the app bundle
        run: |
          out="$RUNNER_TEMP/selftest.txt"
          MAGIC_PDF_SELFTEST="$out" perl -e 'alarm 120; exec @ARGV' \
            dist/magic-pdf.app/Contents/MacOS/magic-pdf "$PWD/tests/fixtures/sample.pdf"
          cat "$out"
          grep -q "40 pages" "$out"

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic-pdf-macos
          path: dist/*.dmg

  linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    # The oldest supported runner: the AppImage uses the host's glibc, so building
    # against an old one keeps it running on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev desktop-file-utils xvfb xauth libgl1-mesa-dri libxkbcommon-x11-0

      - name: Determine version
        run: |
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "${{ github.ref_type }}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$cargo_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"; exit 1
          fi
          echo "VERSION=$cargo_version" >> "$GITHUB_ENV"

      - name: Fetch PDFium
        run: ./scripts/fetch-pdfium.sh

      - name: Test
        run: cargo test --release

      - name: Build AppImage
        run: packaging/linux/build-appimage.sh

      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          out="$RUNNER_TEMP/selftest.txt"
          MAGIC_PDF_SELFTEST="$out" timeout 120 xvfb-run -a \
            "dist/magic-pdf-$VERSION-x86_64.AppImage" --new-window "$PWD/tests/fixtures/sample.pdf"
          cat "$out"
          grep -q "40 pages" "$out"

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic-pdf-linux
          path: dist/*.AppImage

  publish:
    if: >-
      github.ref_type == 'tag'
      || needs.check.outputs.release == 'true'
      || (inputs.publish && github.ref == 'refs/heads/master')
    needs: [check, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          version="${tag#v}"
          cat > notes.md <<EOF
          ## Windows

          Download **magic-pdf-$version-setup.exe** and run it. It installs for your user only
          (no administrator rights needed) and adds magic-pdf to the Start menu and to "Open with"
          for PDF files. At the end it can open Windows Settings to make magic-pdf your default
          PDF viewer.

          Windows may warn that the installer is from an unknown publisher, because it is not
          code-signed. Choose **More info**, then **Run anyway**.

          No installer wanted? Unzip **magic-pdf-$version-windows-portable.zip** anywhere and run
          \`magic-pdf.exe\`.

          ## macOS (Apple Silicon and Intel, macOS 11 or later)

          Open **magic-pdf-$version-macos.dmg** and drag magic-pdf into Applications.

          The app is not notarised by Apple, so the first start is blocked ("cannot verify that it
          is free of malware"). Click **Done**, then open **System Settings → Privacy & Security**,
          scroll down and click **Open Anyway** next to magic-pdf. This is needed only once.

          To make it your PDF viewer: select a PDF in Finder, **File → Get Info**, choose magic-pdf
          under **Open with**, then **Change All…**.

          ## Linux (x86_64)

          Download **magic-pdf-$version-x86_64.AppImage**, make it executable and run it:

          \`\`\`
          chmod +x magic-pdf-$version-x86_64.AppImage
          ./magic-pdf-$version-x86_64.AppImage
          \`\`\`

          It runs on most distributions from 2022 on (glibc 2.35 or newer). If it complains
          about FUSE, install \`libfuse2\` (Ubuntu 24.04: \`libfuse2t64\`) or start it with
          \`APPIMAGE_EXTRACT_AND_RUN=1\`. Updates are installed from within the app, which
          replaces the AppImage file in place. To add it to the application menu, use a tool
          such as Gear Lever or AppImageLauncher.
          EOF
          sed -i 's/^          //' notes.md
          # What's new, written in the pull request that bumped the version.
          if [ -f "release-notes/$version.md" ]; then
            { cat "release-notes/$version.md"; echo; cat notes.md; } > notes-full.md
            mv notes-full.md notes.md
          else
            echo "::warning::release-notes/$version.md is missing; the release has only the installation notes."
          fi
          # --target creates the tag at this commit when it does not exist yet.
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            dist/*.exe dist/*.zip dist/*.dmg dist/*.AppImage \
            --title "magic-pdf $version" --notes-file notes.md
