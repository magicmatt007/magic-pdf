[package]
name = "magic-pdf"
version = "0.12.1"
edition = "2024"
description = "Lightweight cross-platform PDF viewer with horizontal page layout"
license = "AGPL-3.0-or-later"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "glow", "wayland", "x11", "clipboard", "links", "accesskit"] }
pdfium-render = { version = "0.9.6", default-features = false, features = ["pdfium_latest", "thread_safe"] }
crossbeam-channel = "0.5"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
sha2 = { version = "0.11", features = ["oid"] }
# Checking digital signatures (RSA and ECDSA over SHA-1/2).
sha1 = { version = "0.11", features = ["oid"] }
rsa = { version = "0.10", default-features = false, features = ["std", "pkcs1v15", "encoding"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std", "pkcs8"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "std", "pkcs8"] }
# Signing: reading certificate files (.p12/.pfx).
p12-keystore = "0.4"
directories = "6"
open = "5"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
env_logger = "0.11"
lopdf = { version = "0.47.0", default-features = false }
similar = { version = "3.2.1", default-features = false }
sys-locale = "0.3.2"
roxmltree = "0.21.2"

[build-dependencies]
# Embeds the icon into Windows builds; unused elsewhere.
winresource = "0.1"

# GNOME/Wayland: windows draw their own title bar. eframe only enables winit's
# proper one (with the window title) among its default features, which we turn off.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }
# Touchpad pinch-to-zoom on Wayland (winit does not report it there). The same
# versions winit already uses, so nothing new is built.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
raw-window-handle = "0.6"
libc = "0.2"

# macOS: receive "open document" requests from Finder.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-services",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "NSURL",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_Xps",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
